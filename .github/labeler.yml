documentation:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - "**/*.md"
          - ".github/ISSUE_TEMPLATE/**"
          - ".github/pull_request_template.md"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - uv.lock
          - requirements*.txt
          - ".github/dependabot.yml"

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/dependabot.yml"
          - ".github/labeler.yml"
