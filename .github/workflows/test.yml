name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pillow sqlalchemy sqlmodel aiosqlite

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Run Ruff
        run: |
          python -m pip install ruff
          ruff check .
