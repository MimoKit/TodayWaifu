name: Issue triage

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply issue labels
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) return;

            const labels = new Set(['needs-triage', 'bug']);

            const wanted = [...labels];
            const existing = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const current = new Set(existing.map(label => label.name));
            const missing = wanted.filter(label => !current.has(label));
            if (missing.length === 0) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: missing,
            });
