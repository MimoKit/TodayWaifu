[project]
name = "todaywaifu"
version = "1.0.0"
description = "基于 GsCore 框架的多游戏「今日老婆」娱乐插件"
requires-python = ">=3.11,<4.0"
authors = [{ name = "MimoKit" }]
license = { text = "GPL-3.0-or-later" }
# 仅声明 GsCore 框架范围之外的依赖：Pillow 由 Core 自带，python / fastapi / pydantic /
# gsuid-core / sqlmodel / apscheduler / pydantic-ai 属框架基础依赖，重复声明会与 Core
# 自身的版本约束产生冲突。此处列出的依赖由框架在启动时自动安装。
dependencies = []

[tool.gsuid]
name = "TodayWaifu"
desc = "多游戏「今日老婆」，含抽老婆 / 抢 / 送 / 离婚、萝莉 / 正太 / 异环 / 战双、自定义角色图库"
version = "1.0.0"
author = "MimoKit"
icon = "ICON.png"
